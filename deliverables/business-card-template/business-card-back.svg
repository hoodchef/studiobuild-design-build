<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="675" viewBox="0 0 1125 675" role="img" aria-labelledby="title desc">
  <title id="title">StudioBuild Business Card Back</title>
  <desc id="desc">Print-ready back side with bleed, trim, safe area, and crop marks.</desc>

  <defs>
    <linearGradient id="inkField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f11"/>
      <stop offset="100%" stop-color="#15191d"/>
    </linearGradient>
    <radialGradient id="metalGlow" cx="0" cy="0" r="1" gradientTransform="translate(960 130) scale(320 240)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48a6a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a48a6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1125" height="675" fill="url(#inkField)"/>
  <rect x="0" y="0" width="1125" height="675" fill="url(#metalGlow)"/>

  <!-- Trim box -->
  <rect x="37.5" y="37.5" width="1050" height="600" fill="none" stroke="#4a5360" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- Safe area -->
  <rect x="75" y="75" width="975" height="525" fill="none" stroke="#a48a6a" stroke-width="1" stroke-dasharray="5 7"/>

  <!-- Crop marks -->
  <g stroke="#c9ccd1" stroke-width="2">
    <line x1="12" y1="37.5" x2="30" y2="37.5"/>
    <line x1="37.5" y1="12" x2="37.5" y2="30"/>
    <line x1="1087.5" y1="12" x2="1087.5" y2="30"/>
    <line x1="1095" y1="37.5" x2="1113" y2="37.5"/>

    <line x1="12" y1="637.5" x2="30" y2="637.5"/>
    <line x1="37.5" y1="645" x2="37.5" y2="663"/>
    <line x1="1095" y1="637.5" x2="1113" y2="637.5"/>
    <line x1="1087.5" y1="645" x2="1087.5" y2="663"/>
  </g>

  <text x="95" y="188" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="58" font-weight="640" letter-spacing="2" fill="#f5f4f0">BUILT WITH CLARITY.</text>
  <text x="95" y="252" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="58" font-weight="640" letter-spacing="2" fill="#f5f4f0">FINISHED WITH CONFIDENCE.</text>

  <line x1="95" y1="303" x2="1030" y2="303" stroke="#a48a6a" stroke-width="2"/>

  <text x="95" y="388" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">CUSTOM DECKS + OUTDOOR SPACES</text>
  <text x="95" y="426" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">RENOVATIONS</text>
  <text x="95" y="464" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">CUSTOM HOMES</text>
  <text x="95" y="502" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">DESIGN + BUILD</text>
  <text x="95" y="540" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">PROJECT MANAGEMENT + PERMITS</text>

  <text x="1030" y="544" text-anchor="end" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="48" font-weight="650" letter-spacing="2" fill="#f5f4f0">STUDIOBUILD</text>
  <text x="1030" y="575" text-anchor="end" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="16" letter-spacing="4" fill="#c9ccd1">DESIGN + BUILD</text>
  <text x="1030" y="597" text-anchor="end" font-family="'Source Serif 4', Georgia, serif" font-size="20" fill="#f5f4f0">778-903-7744</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="675" viewBox="0 0 1125 675" role="img" aria-labelledby="title desc">
  <title id="title">StudioBuild Business Card Front Print Artwork</title>
  <desc id="desc">Guide-free print artwork for front side with bleed included.</desc>

  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1216"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <radialGradient id="accentBlur" cx="0" cy="0" r="1" gradientTransform="translate(175 120) scale(330 230)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48a6a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a48a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkBlur" cx="0" cy="0" r="1" gradientTransform="translate(980 540) scale(300 220)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a4048" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#3a4048" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1125" height="675" fill="url(#bgWash)"/>
  <rect x="0" y="0" width="1125" height="675" fill="url(#accentBlur)"/>
  <rect x="0" y="0" width="1125" height="675" fill="url(#inkBlur)"/>

  <text x="95" y="132" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="52" font-weight="650" letter-spacing="2" fill="#f5f4f0">STUDIOBUILD</text>
  <text x="95" y="164" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#c9ccd1">DESIGN + BUILD</text>

  <line x1="95" y1="202" x2="1030" y2="202" stroke="#a48a6a" stroke-width="2"/>

  <text x="95" y="322" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="66" font-weight="600" fill="#f5f4f0">Caleb Stapelmann</text>
  <text x="95" y="366" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="22" letter-spacing="2" fill="#c9ccd1">FOUNDER | DESIGN + BUILD</text>

  <text x="95" y="482" font-family="'Source Serif 4', Georgia, serif" font-size="32" fill="#f5f4f0">778-903-7744</text>
  <text x="95" y="526" font-family="'Source Serif 4', Georgia, serif" font-size="32" fill="#f5f4f0">hello@studiobuild.ca</text>
  <text x="95" y="570" font-family="'Source Serif 4', Georgia, serif" font-size="32" fill="#f5f4f0">studiobuild.ca</text>

  <text x="1030" y="528" text-anchor="end" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="18" letter-spacing="2" fill="#c9ccd1">LOWER MAINLAND, BC</text>
  <text x="1030" y="558" text-anchor="end" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="18" letter-spacing="2" fill="#c9ccd1">VANCOUVER | NORTH SHORE | FRASER VALLEY</text>
</svg>

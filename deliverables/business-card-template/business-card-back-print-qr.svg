<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="675" viewBox="0 0 1125 675" role="img" aria-labelledby="title desc">
  <title id="title">StudioBuild Business Card Back Print Artwork (QR Version)</title>
  <desc id="desc">Guide-free print artwork with QR code to studiobuild.ca.</desc>

  <defs>
    <linearGradient id="inkField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f11"/>
      <stop offset="100%" stop-color="#15191d"/>
    </linearGradient>
    <radialGradient id="metalGlow" cx="0" cy="0" r="1" gradientTransform="translate(960 130) scale(320 240)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48a6a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a48a6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1125" height="675" fill="url(#inkField)"/>
  <rect x="0" y="0" width="1125" height="675" fill="url(#metalGlow)"/>

  <text x="95" y="188" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="54" font-weight="640" letter-spacing="2" fill="#f5f4f0">BUILT WITH CLARITY.</text>
  <text x="95" y="248" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="54" font-weight="640" letter-spacing="2" fill="#f5f4f0">FINISHED WITH CONFIDENCE.</text>

  <line x1="95" y1="290" x2="1030" y2="290" stroke="#a48a6a" stroke-width="2"/>

  <text x="95" y="366" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="21" letter-spacing="2" fill="#c9ccd1">CUSTOM DECKS + OUTDOOR SPACES</text>
  <text x="95" y="402" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="21" letter-spacing="2" fill="#c9ccd1">RENOVATIONS</text>
  <text x="95" y="438" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="21" letter-spacing="2" fill="#c9ccd1">CUSTOM HOMES</text>
  <text x="95" y="474" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="21" letter-spacing="2" fill="#c9ccd1">DESIGN + BUILD</text>
  <text x="95" y="510" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="21" letter-spacing="2" fill="#c9ccd1">PROJECT MANAGEMENT + PERMITS</text>

  <text x="95" y="572" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="17" letter-spacing="2" fill="#a48a6a">SCAN FOR PORTFOLIO + CONSULTATION</text>

  <rect x="835" y="334" width="210" height="210" rx="10" fill="#f5f4f0"/>
  <image href="studiobuild-qr.svg" x="850" y="349" width="180" height="180" preserveAspectRatio="xMidYMid meet"/>

  <text x="1030" y="576" text-anchor="end" font-family="'Plus Jakarta Sans', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="38" font-weight="650" letter-spacing="2" fill="#f5f4f0">STUDIOBUILD</text>
  <text x="1030" y="602" text-anchor="end" font-family="'Source Serif 4', Georgia, serif" font-size="20" fill="#f5f4f0">778-903-7744</text>
</svg>

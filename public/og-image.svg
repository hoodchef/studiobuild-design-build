<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">StudioBuild Open Graph Image</title>
  <desc id="desc">StudioBuild Design + Build branding image.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="accent" cx="0" cy="0" r="1" gradientTransform="translate(170 90) scale(520 340)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48a6a" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#a48a6a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#accent)" />

  <text x="90" y="230" fill="#f8f8f5" font-size="80" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-weight="800" letter-spacing="2">STUDIOBUILD</text>
  <text x="92" y="280" fill="#c8ced6" font-size="24" font-family="'Space Grotesk', 'Avenir Next', sans-serif" font-weight="500" letter-spacing="7">DESIGN + BUILD</text>

  <line x1="90" y1="325" x2="1110" y2="325" stroke="#a48a6a" stroke-width="3" />

  <text x="90" y="420" fill="#f8f8f5" font-size="54" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-weight="700">In-House Design. Custom Builds.</text>
  <text x="90" y="478" fill="#f8f8f5" font-size="54" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-weight="700">Built Right.</text>

  <text x="90" y="545" fill="#c8ced6" font-size="24" font-family="'Source Serif 4', Georgia, serif">Serving Vancouver, North Vancouver, West Vancouver, Burnaby, Coquitlam, Port Moody, Surrey, Richmond, Langley.</text>
</svg>
